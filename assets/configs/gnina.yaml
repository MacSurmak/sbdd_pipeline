gnina:
  enabled: true                      # Universal 3D-CNN rescoring for both Glide and Uni-Dock poses
  rescore_mode: "score_only"         # "score_only" (instant 3D-CNN evaluation) or "minimize" (local BFGS + CNN)
  cnn_model: ""                      # Empty string uses default fast GNINA 1.3 distilled ensemble
  resources:
    cpus: 2                          # CPU threads (--cpu) allocated per GNINA rescoring task
    memory_gb: 4                     # RAM allocation per task in GB
    slurm_gres: "shard:2"            # Slurm GRES request


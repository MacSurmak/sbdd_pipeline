gnina:
  enabled: true
  exhaustiveness: 32                 # Thorough sampling for blind docking of flexible ligands
  cnn_scoring: "rescore"             # none, rescore, refinement, all
  num_modes: 16                      # Number of binding poses to output
  autobox_add: 4.0                   # Tight binding cleft focus (Å)
  cnn_model: "crossdock_default2018" # Default GNINA CNN model
  batch_size: 1                      # 1 substance per task for maximum horizontal GPU shard parallelism
  resources:
    cpus: 2                          # CPU threads (--cpu) allocated per GNINA Slurm task
    memory_gb: 4                     # RAM allocation per task in GB
    slurm_gres: "shard:1"            # Slurm GRES request: "shard:1" (up to 16 concurrent tasks per GPU)


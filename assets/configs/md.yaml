md_simulation:
  enabled: true
  pbc_center: "Protein"
  pbc_extract: "COMPLEX"
  system_build:
    protein_forcefield: "leaprc.protein.ff19SB"
    gaff_forcefield: "leaprc.gaff2"
    lipid_forcefield: "leaprc.lipid21"
    water_leaprc: "leaprc.water.opc3"
    water_box: "OPC3BOX"
    box_type: "oct"
    box_padding: 10.0
    ss_cutoff: 3.0
    neutralize: true
    salt_conc: 0.15
    restraint_forces: [1000, 500, 250, 100, 50, 10]
    water_names: ["SOL", "Water", "HOH", "WAT", "TIP3", "OPC"]
    ion_names: ["K+", "Cl-", "NA+", "CL-", "NA", "CL", "K", "POT", "CLA", "SOD", "MG", "ZN", "CA", "CAL", "MG2+", "CA2+", "ZN2+"]
  ligand_parametrization:
    method: "ashgc"                    # "ashgc" (OpenFF GNN), "resp" (ORCA 6 quantum ESP), or "bcc" (Antechamber AM1-BCC)
    forcefield: "openff-2.3.0"         # Small molecule force field: openff-2.3.0, openff-2.2.1, gaff2, gaff
    orca:
      nprocs: 8                         # Parallel CPU threads (%pal nprocs)
      maxcore_mb: 2000                  # Per-core RAM allocation in MB (%maxcore)
    bcc:
      scfconv: "1.d-10"
      grms_tol: 0.0005
  declash:
    cutoff: 0.10
    niter: 300
    damping: 0.8
    max_move: 0.05
    jitter: 0.02
    tolerance: 1e-6
  execution:
    cpus: 6
    memory_gb: 8
    jobs_per_gpu: 2
    minim_flags: "-nb gpu -ntmpi 1 -pin inherit"
    eq_flags: "-nb gpu -pme gpu -update gpu -bonded gpu -ntmpi 1 -pin inherit"
    prod_flags: "-nb gpu -pme gpu -update gpu -bonded gpu -ntmpi 1 -pin inherit"
  production:
    temperature: 310.15
    total_time_ns: 100
    chunk_size_ns: 10
    replicates: 3
    dt_ps: 0.002
    compressibility: "4.5e-5"
    tau_p: 5.0
    restraints_group: "C-alpha"
    restraints_fc: 50
  metrics:
    heavy_cutoff: 3.5
    hyd_cutoff: 4.0
    pol_cutoff: 3.4
  analysis_sampling:
    start_ns: 1.0                      # Canonical start buffer for all post-MD analysis (ns)
    sample_interval_ps: 500.0          # Canonical statistical independence stride for MM-PBSA and clustering (ps)
  clustering:
    align_group: "Backbone"             # Basis group for coordinate superimposition (e.g. Backbone, C-alpha)
    cluster_group: "Ligand"             # Feature group for manifold reduction (e.g. Pocket, Backbone, Ligand, 'Pocket + Ligand')
    dim_reduction: "tica"               # Dimensionality reduction engine: tica or pca
    algorithm: "auto_kmeans"            # Clustering algorithm: hdbscan (density), hierarchical (RMSD cutoff), auto_kmeans, kmeans
    rmsd_cutoff: 1.5                    # Heavy-atom RMSD distance threshold for hierarchical clustering (Å)
    tica_lag_ns: 2.0                    # Lag time for time-lagged cross-correlation in TICA (ns)
    variance_cutoff: 0.85               # Cumulative variance threshold for top-k component selection
    n_clusters: 3                       # Number of physical macro-basins (strictly for kmeans)
    pocket_radius: 5.0                  # Spatial cutoff radius from reference ligand for pocket definition (Å)
    min_cluster_population: 5.0         # Population cutoff percentage (%) for automated basin recommendation
    temp_k: 310.15                      # Simulation temperature for Delta G free energy landscape calculation (K)
    auto_promote: false                 # Headless non-interactive cluster promotion mode
    plateau_detection:
      enabled: true
      paradigm: "adaptive_zscore"        # Options: adaptive_zscore, macro_step, running_range, inverted_vel
      smoothing_tau_ns: 0.5              # Zero-phase EMA decay time (ns)
      significance_z_crit: 2.0           # Transition threshold in units of thermal sigma
      dilation_buffer_ns: 0.4            # Transition buffer (+/- delta in ns)
      min_dwell_ns: 5.0                  # Minimum plateau duration (ns)
      enforce_cluster_continuity: true   # Split plateau if manifold cluster changes

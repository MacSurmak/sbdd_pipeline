md_simulation:
  enabled: true
  pbc_center: "Protein"
  pbc_extract: "COMPLEX"
  system_build:
    protein_forcefield: "leaprc.protein.ff19SB"
    gaff_forcefield: "leaprc.gaff2"
    lipid_forcefield: "leaprc.lipid21"
    water_leaprc: "leaprc.water.opc3"
    water_box: "OPC3BOX"
    box_type: "oct"
    box_padding: 10.0
    ss_cutoff: 3.0
    neutralize: true
    salt_conc: 0.15
    restraint_forces: [1000, 500, 250, 100, 50, 10]
    water_names: ["SOL", "Water", "HOH", "WAT", "TIP3", "OPC"]
    ion_names: ["K+", "Cl-", "NA+", "CL-", "NA", "CL", "K", "POT", "CLA", "SOD", "MG", "ZN", "CA", "CAL", "MG2+", "CA2+", "ZN2+"]
  ligand_parametrization:
    method: "resp"                     # "resp" (ORCA 6 quantum ESP) or "bcc" (Antechamber AM1-BCC)
    forcefield: "gaff2"                 # Small molecule force field: gaff or gaff2
    orca:
      nprocs: 8                         # Parallel CPU threads (%pal nprocs)
      maxcore_mb: 4000                  # Per-core RAM allocation in MB (%maxcore)
      preopt_theory: "xTB2"             # Stage 1A: Ultra-fast semi-empirical pre-relaxation functional (xTB2 or PBE)
      preopt_basis: "none"              # none for xTB, def2-SVP for DFT
      preopt_opt_level: "Opt"           # Stage 1A: Geometry convergence tolerance (Opt, LooseOpt)
      refine_theory: "B3LYP"            # Stage 1B: High-level hybrid DFT geometry refinement functional
      refine_basis: "def2-SVP"          # Stage 1B: Refinement basis set
      refine_opt_level: "Opt"           # Stage 1B: Geometry convergence tolerance (Opt, TightOpt)
      opt_dispersion: "D4"              # Dispersion correction (D3BJ, D4, none)
      opt_solvent: "CPCM(Water)"        # Implicit solvent model (CPCM(Water), SMD, none)
      opt_rijcosx: true                 # RIJCOSX approximation for Coulomb and HF exchange
      opt_maxiter: 200                  # Max geometry optimization cycles per stage
      geom_scf_convergence: "NormalSCF" # SCF convergence for geometry relaxation (NormalSCF)
      geom_scf_maxiter: 200             # Max SCF iterations for geometry relaxation
      esp_theory: "HF"                  # Stage 2: Canonical AMBER charge calibration theory (gas-phase)
      esp_basis: "6-31G*"               # Stage 2: Canonical AMBER charge calibration basis set
      esp_density: "Merz-Kollman"       # ESP grid algorithm
      esp_scf_convergence: "TightSCF"   # SCF convergence for ESP single-point evaluation (TightSCF)
      esp_scf_maxiter: 250              # Max SCF iterations for ESP calculation
    bcc:
      scfconv: "1.d-10"
      grms_tol: 0.0005
  declash:
    cutoff: 0.10
    niter: 300
    damping: 0.8
    max_move: 0.05
    jitter: 0.02
    tolerance: 1e-6
  execution:
    minim_flags: "-nb gpu -ntmpi 1 -pin on"
    eq_flags: "-nb gpu -pme gpu -update gpu -bonded gpu -ntmpi 1 -pin on"
    prod_flags: "-nb gpu -pme gpu -update gpu -bonded gpu -ntmpi 1 -pin on"
  production:
    temperature: 310.15
    total_time_ns: 100
    chunk_size_ns: 10
    replicates: 3
    dt_ps: 0.002
    compressibility: "4.5e-5"
    tau_p: 5.0
    restraints_group: "C-alpha"
    restraints_fc: 50
  metrics:
    heavy_cutoff: 3.5
    hyd_cutoff: 4.0
    pol_cutoff: 3.4


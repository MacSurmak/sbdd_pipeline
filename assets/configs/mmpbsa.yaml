mmpbsa:
  enabled: true
  start_ns: 1.0                      # Initial solvent relaxation buffer before sampling (ns)
  sample_interval_ps: 500.0          # Statistical independence interval based on autocorrelation time (ps)
  per_residue_decomp: true           # Enable per-residue binding energy decomposition
  temperature: 310.15
  salt_conc: 0.15


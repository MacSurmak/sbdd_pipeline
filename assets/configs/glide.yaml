glide:
  enabled: true
  precision: "SP"                    # HTVS, SP, XP
  poses_per_lig: 16
  sample_rings: true
  epik_penalties: true
  forcefield: "OPLS4"
  recep_vscale: 0.85                 # Softened vdW potential for cryo-EM & MD breathing
  lig_vscale: 0.85
  postdock: true
  write_csv: true
  grid:
    inner_box: [6, 6, 6]
    outer_box: [18, 18, 18]
    forcefield: "OPLS4"
  ligprep:
    target_ph: 7.4
    ph_tolerance: 2.0
    force_field: 16                  # 16 = OPLS4, 14 = OPLS_2005
    max_states: 32


glide:
  enabled: false
  precision: "SP"                    # HTVS, SP, XP
  poses_per_lig: 3
  sample_rings: true
  epik_penalties: true
  forcefield: "OPLS4"
  recep_vscale: 1.0                 # Softened vdW potential for cryo-EM & MD breathing
  lig_vscale: 1.0
  recep_ccut: 0.25
  lig_ccut: 0.15
  postdock: true
  write_csv: true
  batch_size: 25                     # 25 substances per task to amortize grid loading & license checkout
  resources:
    cpus: 1                          # Single-core per -NOJOBID Glide task
    memory_gb: 4                     # RAM allocation per Glide task in GB
  grid:
    inner_box: [10, 10, 10]
    outer_box: [26, 26, 26]
    forcefield: "OPLS4"
  ligprep:
    target_ph: 7.4
    ph_tolerance: 2.0
    force_field: 16                  # 16 = OPLS4, 14 = OPLS_2005
    max_states: 32
    batch_size: 50                   # Substances per chunk for LigPrep preparation
    cpus: 1                          # Single-core per -NOJOBID LigPrep batch
    memory_gb: 4                     # RAM allocation per LigPrep batch in GB


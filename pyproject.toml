[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sbdd-pipeline"
version = "2.0.0"
description = "Industrial SBDD Nextflow HPC Orchestrator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0"
]

[project.scripts]
sbdd = "cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/unit"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]


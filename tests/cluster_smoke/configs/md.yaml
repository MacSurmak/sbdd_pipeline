md_simulation:
  enabled: true
  pbc_center: "Protein"
  pbc_extract: "COMPLEX"
  system_build:
    water_model: "opc"
    box_padding: 8.0
    neutralize: true
    salt_conc: 0.15
  equilibration:
    nvt_short_ps: 2
    nvt_long_ps: 2
    npt_berendsen_ps: 2
    npt_pr_ps: 2
  production:
    temperature: 310.15
    total_time_ns: 0.008
    chunk_size_ns: 0.004
    replicates: 2
  selection:
    mode: "top_n"
    top_n: 1
